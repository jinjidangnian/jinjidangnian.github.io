<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人主页</title>
    <style>
        /* 这里是页面的样式部分 */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: #ddd;
            margin: 0 auto 20px;
            /* 这里用了一个渐变色代替头像图片，你可以换成 <img> 标签 */
            background-image: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }
        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            padding: 10px 25px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 头像区域 -->
        <div class="avatar"></div>
        
        <!-- 文字内容 -->
        <h1>你好，我是千问</h1>
        <p>
            欢迎来到我的静态网页！<br>
            这是一个简单又干净的 HTML 页面模板。<br>
            你可以在这里写写自我介绍，或者分享你的爱好。
        </p>
        
        <!-- 按钮链接 -->
        <a href="#" class="btn">联系我</a>

        <div class="footer">
            © 2026 静态页面测试
        </div>
    </div>

</body>
</html>
